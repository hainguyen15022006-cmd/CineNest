<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu management – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Sơn (người 5) · Đặc tả: trang 7 – CRUD món -->
  <header id="app-header"></header>
  <main>
    <h1>Menu management</h1>

    <form id="menu-form" class="card"><h2>Add or edit item</h2><input type="hidden" name="id">
      <div class="row">
        <div class="field"><label for="name">Item name</label><input id="name" name="name" required></div>
        <div class="field"><label for="category">Category</label><select id="category" name="category"><option value="DRINK">Drink</option><option value="SNACK">Snack</option><option value="FOOD">Food</option></select></div>
        <div class="field"><label for="priceVnd">Price (VND)</label><input id="priceVnd" name="priceVnd" type="number" min="0" step="1000" required></div>
        <div class="field"><label for="isActive">Available for sale</label><select id="isActive" name="isActive"><option value="true">Yes</option><option value="false">No</option></select></div>
      </div>
      <div class="field"><label for="imageUrl">Image URL</label><input id="imageUrl" name="imageUrl"></div>
      <div class="row"><button type="submit">Save</button><button type="button" class="secondary" id="btn-reset">New</button></div>
    </form>
    <div id="list" class="table-wrap"></div>
  </main>
  <script type="module" src="./menu.ts"></script>
</body>
</html>
