<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie management – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Thành Lê (người 4) · Đặc tả: trang 6 (MOV01, MOV07) – CRUD phim -->
  <header id="app-header"></header>
  <main>
    <h1>Movie management</h1>

    <form id="movie-form" class="card"><h2>Add or edit movie</h2><input type="hidden" name="id">
      <div class="row">
        <div class="field"><label for="title">Movie title</label><input id="title" name="title" required></div>
        <div class="field"><label for="genre">Genre</label><input id="genre" name="genre" required></div>
        <div class="field"><label for="durationMinutes">Duration (minutes)</label><input id="durationMinutes" name="durationMinutes" type="number" min="1" required></div>
        <div class="field"><label for="ageLabel">Age rating</label><input id="ageLabel" name="ageLabel" value="P" required></div>
        <div class="field"><label for="isActive">Available</label><select id="isActive" name="isActive"><option value="true">Yes</option><option value="false">No</option></select></div>
      </div>
      <div class="field"><label for="description">Description</label><input id="description" name="description"></div>
      <div class="field"><label for="posterUrl">Poster URL</label><input id="posterUrl" name="posterUrl"></div>
      <div class="row"><button type="submit">Save</button><button type="button" class="secondary" id="btn-reset">New</button></div>
    </form>
    <div class="row" style="margin-bottom:8px"><div class="field" style="flex:1"><label for="search">Search movies by title</label><input id="search" type="search" placeholder="Enter a movie title…" autocomplete="off"></div>
      <p class="muted">The movie catalog is imported with <code>npm run db:import-movies</code> (The Movies Dataset – Kaggle). The NR label means not rated; a manager can update it when an accurate rating is available.</p></div>
    <div id="list" class="table-wrap"></div>
  </main>
  <script type="module" src="./movies.ts"></script>
</body>
</html>
