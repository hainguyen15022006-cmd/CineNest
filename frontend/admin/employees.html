<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee management – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Dương (người 1) · Đặc tả: trang 3 – tạo/khóa nhân viên; khóa thu hồi phiên ngay (T17) -->
  <header id="app-header"></header>
  <main>
    <h1>Employee management</h1>

    <form id="staff-form" class="card"><h2>Create staff account</h2>
      <div class="row">
        <div class="field"><label for="name">Full name</label><input id="name" name="name" required minlength="2"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" required pattern="0[0-9]{9,10}"></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8"></div>
        <div class="field"><label for="role">Role</label><select id="role" name="role"><option value="STAFF">Staff</option><option value="MANAGER">Manager</option></select></div>
        <div class="field"><button type="submit">Create</button></div>
      </div>
    </form>
    <div id="list" class="table-wrap"></div>
  </main>
  <script type="module" src="./employees.ts"></script>
</body>
</html>
