<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <style>html,body{margin:0;min-height:100%;background:#0b1020;color:#f7f8fc}</style>
  <link rel="stylesheet" href="../shared/styles.css">
  <title>Reports – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Công Thành (người 6) · Đặc tả: trang 10 – booking theo ngày, doanh thu đã thu, giờ phòng, chưa thu và miễn -->
  <header id="app-header"></header>
  <main>
    <h1>Reports</h1>

    <form id="range-form" class="row"><div class="field"><label for="from">From</label><input id="from" name="from" type="date"></div><div class="field"><label for="to">To</label><input id="to" name="to" type="date"></div><div class="field"><button type="submit">View</button></div></form>
    <h2>Bookings by start date and status</h2><div id="bookings" class="table-wrap"></div>
    <h2>Collected revenue by payment date</h2><div id="revenue" class="table-wrap"></div>
    <h2>Room hours used (COMPLETED)</h2><div id="hours" class="table-wrap"></div>
    <h2>Unpaid and waived bookings</h2><div id="unpaid" class="table-wrap"></div>
  </main>
  <script type="module" src="./reports.ts"></script>
</body>
</html>
