<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room and pricing management – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Chúc (người 2) · Đặc tả: trang 4 (BR06, BR08) – CRUD phòng -->
  <header id="app-header"></header>
  <main>
    <h1>Room and pricing management</h1>

    <form id="room-form" class="card"><h2>Add or edit room</h2><input type="hidden" name="id">
      <div class="row">
        <div class="field"><label for="name">Name</label><input id="name" name="name" required></div>
        <div class="field"><label for="capacity">Capacity</label><input id="capacity" name="capacity" type="number" min="1" max="6" value="2" required></div>
        <div class="field"><label for="hourlyPriceVnd">Hourly rate (VND)</label><input id="hourlyPriceVnd" name="hourlyPriceVnd" type="number" min="0" step="1000" required></div>
        <div class="field"><label for="isActive">Active</label><select id="isActive" name="isActive"><option value="true">Yes</option><option value="false">No</option></select></div>
      </div>
      <div class="field"><label for="description">Description</label><input id="description" name="description"></div>
      <div class="field"><label for="amenities">Amenities (comma-separated)</label><input id="amenities" name="amenities"></div>
      <div class="field"><label for="images">Image URLs (comma-separated)</label><input id="images" name="images"></div>
      <div class="row"><button type="submit">Save</button><button type="button" class="secondary" id="btn-reset">New</button></div>
    </form>
    <div id="list" class="table-wrap"></div>
  </main>
  <script type="module" src="./rooms.ts"></script>
</body>
</html>
