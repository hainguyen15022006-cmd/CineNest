<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý phòng và giá – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Chúc (người 2) · Đặc tả: trang 4 (BR06, BR08) – CRUD phòng -->
  <header id="app-header"></header>
  <main>
    <h1>Quản lý phòng và giá</h1>

    <form id="room-form" class="card"><h2>Thêm / sửa phòng</h2><input type="hidden" name="id">
      <div class="row">
        <div class="field"><label for="name">Tên</label><input id="name" name="name" required></div>
        <div class="field"><label for="capacity">Sức chứa</label><input id="capacity" name="capacity" type="number" min="1" max="20" value="2" required></div>
        <div class="field"><label for="hourlyPriceVnd">Giá/giờ (VND)</label><input id="hourlyPriceVnd" name="hourlyPriceVnd" type="number" min="0" step="1000" required></div>
        <div class="field"><label for="isActive">Hoạt động</label><select id="isActive" name="isActive"><option value="true">Có</option><option value="false">Không</option></select></div>
      </div>
      <div class="field"><label for="description">Mô tả</label><input id="description" name="description"></div>
      <div class="field"><label for="amenities">Tiện nghi (phân cách bằng dấu phẩy)</label><input id="amenities" name="amenities"></div>
      <div class="field"><label for="images">URL ảnh (phân cách bằng dấu phẩy)</label><input id="images" name="images"></div>
      <div class="row"><button type="submit">Lưu</button><button type="button" class="secondary" id="btn-reset">Tạo mới</button></div>
    </form>
    <div id="list" class="table-wrap"></div>
  </main>
  <script type="module" src="./rooms.ts"></script>
</body>
</html>
