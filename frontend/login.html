<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Dương (người 1) · Đặc tả: trang 3 – phiên phía máy chủ, giới hạn thử đăng nhập -->
  <header id="app-header"></header>
  <main>
    <h1>Sign in</h1>

    <form id="login-form" class="card" style="max-width:420px">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button type="submit">Sign in</button>
      <p class="muted">Don't have an account? <a href="./register.html">Create account</a></p>
      <p class="muted">Demo: khach@demo.local / Khach#123 · staff@demo.local / Staff#1234 · manager@demo.local / Manager#123</p>
    </form>
  </main>
  <script type="module" src="./login.ts"></script>
</body>
</html>
