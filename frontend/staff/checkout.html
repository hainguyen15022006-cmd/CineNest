<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice and payment – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Công Thành (người 6) · Đặc tả: trang 7, 8 – Tổng gốc, Điều chỉnh (chỉ APPROVED), Số phải trả; kết thúc sớm; đề nghị giảm/miễn; chưa thu -->
  <header id="app-header"></header>
  <main>
    <h1>Invoice and payment</h1>

    <div id="invoice" class="card"></div>
    <div class="row" id="actions"></div>
    <section class="card"><h2>End session early (EX01)</h2>
      <form id="end-form" class="row"><div class="field" style="flex:1"><label for="reason">Reason</label><input id="reason" name="reason" required maxlength="300"></div><div class="field"><button type="submit" class="danger">End session early</button></div></form>
    </section>
    <section class="card"><h2>Request a discount or waiver (EX03, EX04 – manager approval required)</h2>
      <form id="adj-form" class="row">
        <div class="field"><label for="kind">Type</label><select id="kind" name="kind"><option value="REDUCE">Partial discount</option><option value="WAIVE">Full waiver</option></select></div>
        <div class="field"><label for="amountVnd">Discount amount (VND)</label><input id="amountVnd" name="amountVnd" type="number" min="1000" step="1000"></div>
        <div class="field" style="flex:1"><label for="adjReason">Reason</label><input id="adjReason" name="reason" required maxlength="300"></div>
        <div class="field"><button type="submit" class="secondary">Submit request</button></div>
      </form>
    </section>
    <section class="card"><h2>Collect payment</h2>
      <form id="pay-form" class="row"><div class="field"><label for="method">Payment method</label><select id="method" name="method"><option value="CASH">Cash</option><option value="TRANSFER">Bank transfer</option></select></div><div class="field"><button type="submit" id="btn-pay">Record payment</button></div></form>
    </section>
  </main>
  <script type="module" src="./checkout.ts"></script>
</body>
</html>
