<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tìm phòng – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Chúc (người 2) · Đặc tả: trang 10 – Trang chủ có form tìm phòng -->
  <header id="app-header"></header>
  <main>
    <h1>Tìm phòng</h1>

    <form id="search-form" class="card">
      <div class="row">
        <div class="field"><label for="date">Ngày</label><input id="date" name="date" type="date" required></div>
        <div class="field"><label for="duration">Gói</label><select id="duration" name="duration"><option value="120">2 giờ</option><option value="180">3 giờ</option></select></div>
        <div class="field"><label for="startTime">Giờ bắt đầu</label><select id="startTime" name="startTime"></select></div>
        <div class="field"><label for="guests">Số khách</label><input id="guests" name="guests" type="number" min="1" max="4" value="2" required></div>
        <div class="field"><button type="submit">Tìm phòng trống</button></div>
      </div>
      <p class="muted">Mở cửa 09:00–23:00 · gói 2 hoặc 3 giờ · đặt trước tối đa 14 ngày, sớm nhất 30 phút.</p>
    </form>
    <h2>Các phòng</h2>
    <div id="rooms" class="grid"></div>
  </main>
  <script type="module" src="./index.ts"></script>
</body>
</html>
