<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find and book a private movie café room, choose a movie and pre-order food with CineNest.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://picsum.photos">
  <link rel="preconnect" href="https://fastly.picsum.photos" crossorigin>
  <title>Find a room – CineNest</title>
</head>
<body>
  <!-- Chủ sở hữu: Chúc (người 2) · Đặc tả: trang 10 – Trang chủ có form tìm phòng -->
  <header id="app-header"></header>
  <main>
    <h1>Find a room</h1>

    <form id="search-form" class="card">
      <div class="row">
        <div class="field"><label for="date">Date</label><input id="date" name="date" type="date" required></div>
        <div class="field"><label for="duration">Duration</label><select id="duration" name="duration"><option value="120">2 hours</option><option value="180">3 hours</option></select></div>
        <div class="field"><label for="startTime">Start time</label><select id="startTime" name="startTime"></select></div>
        <div class="field"><label for="guests">Guests</label><input id="guests" name="guests" type="number" min="1" max="6" value="2" required></div>
        <div class="field"><button type="submit">Find available rooms</button></div>
      </div>
      <p class="muted">Open 09:00–23:00 · choose a 2- or 3-hour session · book up to 14 days ahead and at least 30 minutes before the start time.</p>
    </form>
    <h2>Rooms</h2>
    <div id="rooms" class="grid"></div>
  </main>
  <script type="module" src="./index.ts"></script>
</body>
</html>
